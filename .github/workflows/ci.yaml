name: Build

on:
  pull_request: ~
  push: ~

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-24.04
    name: PHPStan
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: "none"
          php-version: '8.4'
      - run: composer update --no-interaction --no-progress --ansi
      - run: vendor/bin/phpstan analyse -c phpstan.dist.neon --error-format=github

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - description: 'Symfony 6.4'
            php: '8.2'
            symfony: '6.4'
          - description: 'Symfony 7.4'
            php: '8.5'
            symfony: '7.4'
          - description: 'Symfony 8.1'
            php: '8.5'
            symfony: '8.1'
          - description: 'Symfony 7.4'
            php: '8.6'
            symfony: '7.4'
          - description: 'Symfony 8.1'
            php: '8.6'
            symfony: '8.1'

    name: PHP ${{ matrix.php }} tests (${{ matrix.description }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: ${{ matrix.php }}-${{ matrix.symfony }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Pin Symfony to ${{ matrix.symfony }}
        # Only Symfony components (constraint "^6.4 || ..."), not contracts like symfony/translation-contracts
        run: |
          sed -ri 's/"symfony\/([^"]+)": "\^6\.4[^"]*"/"symfony\/\1": "${{ matrix.symfony }}.*"/' composer.json
      - run: composer update --no-interaction --no-progress --ansi
      - run: composer test
